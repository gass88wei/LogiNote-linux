name: build-linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-linux.*'

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 固定在 22.04：glibc 2.35，产物可在 Deepin 25 (glibc 2.38) 及 Debian 12 上运行。
    # 换成 ubuntu-24.04 会抬到 glibc 2.39，老系统直接 GLIBC_2.39 not found。
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch embedding model
        run: |
          # models/ 在 .gitignore 里，只在 CI 下载，仓库保持轻量。
          # ragIndex.ts 设置了 allowRemoteModels=false，缺文件会导致 RAG 直接抛错，
          # 因此这些文件必须打进包里。
          M=models/Xenova/paraphrase-multilingual-MiniLM-L12-v2
          B=https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main
          mkdir -p "$M/onnx"
          for f in config.json tokenizer.json tokenizer_config.json unigram.json; do
            curl -fL --retry 4 --retry-delay 3 --retry-all-errors -o "$M/$f" "$B/$f"
          done
          curl -fL --retry 4 --retry-delay 3 --retry-all-errors \
            -o "$M/onnx/model_quantized.onnx" "$B/onnx/model_quantized.onnx"
          du -sh "$M" "$M/onnx"/*

      - name: Build frontend + main process
        run: |
          npm run build
          npm run build:electron
          # 硬校验：前端资产必须已构建，否则 electron-builder 打出空壳
          test -f dist/index.html || { echo "dist/index.html 缺失"; exit 1; }
          test -f dist-electron/main.cjs || { echo "dist-electron/main.cjs 缺失"; exit 1; }

      - name: Package AppImage + deb
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Checksums
        run: |
          cd release
          ls -lh
          sha256sum *.AppImage *.deb | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: loginote-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/notes.md <<'EOF'
          Linux 移植版构建。

          - 语音模块为**占位符**（STT_ENABLED=false），按钮显示「语音未启用」，请使用系统自带语音输入
          - 数据目录：`~/.config/LogiNote/`（`vault/` 下为 Markdown 明文）
          - RAG 嵌入模型已内置，无需联网下载
          - 已知限制：无自定义图标（Electron 默认）；「检查更新」不可用（本仓库不产出 latest-linux.yml）
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            release/*.AppImage release/*.deb release/SHA256SUMS.txt \
            --title "LogiNote ${GITHUB_REF_NAME} (Linux)" \
            --notes-file /tmp/notes.md \
            --repo "$GITHUB_REPOSITORY"
